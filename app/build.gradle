plugins {
    id 'com.android.application'
}

android {
    namespace 'app.ncertshelf'
    compileSdk 35

    defaultConfig {
        applicationId "app.ncertshelf"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // PDFs are already compressed; storing them as-is keeps the build fast
    // if you choose to bundle them inside the APK (see README).
    androidResources {
        noCompress 'pdf'
    }
}

dependencies {
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}
