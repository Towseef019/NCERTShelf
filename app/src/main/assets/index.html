<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0a0e1f">
<title>NCERT Shelf</title>
<style>
:root{
  --bg:#0a0e1f; --card:#121a33; --card2:#172041; --line:#232c52;
  --ink:#eef0ff; --mute:#8f99c6; --pill:#252d50;
  --serif:"Noto Serif","Source Serif 4","Source Serif Pro",Georgia,serif;
  --sans:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans)}
body{min-height:100vh}
#app{max-width:640px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.in{animation:up .45s cubic-bezier(.2,.7,.2,1) both}
.fab{position:fixed;top:calc(12px + env(safe-area-inset-top));right:max(12px,calc(50% - 308px));width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--ink);display:grid;place-items:center;padding:0;z-index:30}
.fab svg{width:18px;height:18px;fill:currentColor}
.menu{position:fixed;top:calc(64px + env(safe-area-inset-top));right:max(12px,calc(50% - 308px));min-width:min(240px,calc(100vw - 24px));background:var(--card2);border:1px solid var(--line);border-radius:22px;padding:8px;z-index:31;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink);font:500 16px var(--sans);padding:14px 16px;border-radius:14px}
.menu button:active{background:var(--pill)}
.menu .info{color:var(--mute);font:14px var(--sans);padding:6px 16px 12px}
h1.page{font:700 clamp(26px,8vw,36px)/1.1 var(--sans);letter-spacing:-.02em;margin:56px 0 4px}
.sub{font:clamp(14px,4vw,16px) var(--serif);color:var(--mute);margin:0 0 22px}
.brand{font:700 clamp(28px,9vw,40px)/1.12 var(--serif);margin:56px 0 10px;padding-right:0;background:linear-gradient(90deg,#c4b5fd,#8ec5ff);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.tag{font:clamp(15px,4.4vw,19px)/1.5 var(--serif);color:#aab4e6;margin:0 0 20px}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.pill{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:9px 16px;font:500 clamp(13px,3.8vw,16px) var(--sans);color:#d9defa}
.pill b{color:#8ab4ff;font-weight:600;font-size:1.25em;margin-right:5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sc{position:relative;display:block;color:var(--ink);text-decoration:none;border-radius:28px;border:1px solid var(--line);overflow:hidden;padding:16px 12px 16px 18px;min-height:0;background:linear-gradient(180deg,rgba(var(--rgb),.16),rgba(var(--rgb),.02) 70%),var(--card)}
.sc::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:rgb(var(--rgb))}
.sc .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(var(--rgb),.2);color:rgb(var(--rgb));margin-bottom:12px}
.sc .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.sc h3{font:600 clamp(16px,4.8vw,22px)/1.2 var(--serif);margin:0 0 4px;overflow-wrap:anywhere}
.sc p{font:clamp(12px,3.5vw,15px) var(--serif);color:var(--mute);margin:0}
.sc:active,.ch:active{transform:scale(.98)}
.sc,.ch{transition:transform .12s}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:#aab4e6;font:500 15px var(--sans);padding:10px 0;margin:48px 0 0 -4px}
.back svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.cls{font:600 13px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--mute);margin:30px 6px 12px}
.ch{display:flex;align-items:center;gap:15px;color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:11px 12px;margin-bottom:9px}
.ch .n{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font:600 14px var(--sans);background:rgba(var(--rgb),.17);color:rgb(var(--rgb))}
.ch .t{flex:1;font:clamp(14px,4.2vw,17px)/1.3 var(--serif);min-width:0;overflow-wrap:anywhere}
.ch .m{display:block;font:14px var(--sans);color:var(--mute);margin-top:3px}
.ch .go{flex:none;width:20px;height:20px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.field{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:24px;padding:0 16px;height:54px;margin:6px 0 18px}
.field svg{width:22px;height:22px;stroke:var(--mute);fill:none;stroke-width:2;stroke-linecap:round;flex:none}
.field input{flex:1;min-width:0;border:0;outline:0;background:none;color:var(--ink);font:16px var(--serif)}
.field input::placeholder{color:#6f79a8}
.none{font:18px var(--serif);color:var(--mute);text-align:center;padding:50px 0}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:4px;padding:6px;max-width:calc(100vw - 24px);background:#111936;border:1px solid var(--line);border-radius:44px;z-index:20;box-shadow:0 14px 40px rgba(0,0,0,.5)}
.nav a{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:min(110px,36vw);padding:9px 14px 8px;border-radius:30px;color:var(--mute);text-decoration:none;font:500 13px var(--sans)}
.nav a svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--pill);color:#fff}
</style>
</head>
<body>
<div id="app"></div>
<button class="fab" id="fab" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.9"/><circle cx="12" cy="12" r="1.9"/><circle cx="12" cy="19" r="1.9"/></svg></button>
<div id="menuHost"></div>
<nav class="nav" id="nav"></nav>
<script>
const pad = n => String(n).padStart(2,"0");
const SUBJECTS = ["Physics","Chemistry","Zoology","Botany"];
const SUB = {
  Physics:  {rgb:"96,165,250",  icon:'<circle cx="12" cy="12" r="1.8"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/>'},
  Chemistry:{rgb:"192,132,252", icon:'<path d="M9 3h6M10 3v6l-5.5 9.5A1.5 1.5 0 0 0 5.8 21h12.4a1.5 1.5 0 0 0 1.3-2.5L14 9V3"/><path d="M7.5 15h9"/>'},
  Zoology:  {rgb:"251,191,36",  icon:'<circle cx="6.5" cy="10" r="1.7"/><circle cx="10" cy="6" r="1.7"/><circle cx="14" cy="6" r="1.7"/><circle cx="17.5" cy="10" r="1.7"/><path d="M12 12c-3 0-5.5 3.2-5.5 5.2 0 1.6 1.6 2.3 3 2 .9-.2 1.7-.5 2.5-.5s1.6.3 2.5.5c1.4.3 3-.4 3-2C17.5 15.2 15 12 12 12z"/>'},
  Botany:   {rgb:"52,211,153",  icon:'<path d="M5 19c0-8 5-14 15-14 0 9-5 15-13 15"/><path d="M5 19c3-5 6-8 10-10"/>'}
};
const LIB = {
 11:{
  Physics:[
   {files:"keph1", start:1, ch:["Units and Measurements","Motion in a Straight Line","Motion in a Plane","Laws of Motion","Work, Energy and Power","System of Particles and Rotational Motion","Gravitation"]},
   {files:"keph2", start:8, ch:["Mechanical Properties of Solids","Mechanical Properties of Fluids","Thermal Properties of Matter","Thermodynamics","Kinetic Theory","Oscillations","Waves"]}
  ],
  Chemistry:[
   {files:"kech1", start:1, ch:["Some Basic Concepts of Chemistry","Structure of Atom","Classification of Elements and Periodicity in Properties","Chemical Bonding and Molecular Structure","Thermodynamics","Equilibrium"]},
   {files:"kech2", start:7, ch:["Redox Reactions","Organic Chemistry – Some Basic Principles and Techniques","Hydrocarbons"]}
  ],
  Biology:[
   {files:"kebo1", start:1, ch:["The Living World","Biological Classification","Plant Kingdom","Animal Kingdom","Morphology of Flowering Plants","Anatomy of Flowering Plants","Structural Organisation in Animals","Cell: The Unit of Life","Biomolecules","Cell Cycle and Cell Division","Photosynthesis in Higher Plants","Respiration in Plants","Plant Growth and Development","Breathing and Exchange of Gases","Body Fluids and Circulation","Excretory Products and their Elimination","Locomotion and Movement","Neural Control and Coordination","Chemical Coordination and Integration"],
    tags:["Both","Both","Botany","Zoology","Botany","Botany","Zoology","Both","Both","Both","Botany","Botany","Botany","Zoology","Zoology","Zoology","Zoology","Zoology","Zoology"]}
  ]
 },
 12:{
  Physics:[
   {files:"leph1", start:1, ch:["Electric Charges and Fields","Electrostatic Potential and Capacitance","Current Electricity","Moving Charges and Magnetism","Magnetism and Matter","Electromagnetic Induction","Alternating Current","Electromagnetic Waves"]},
   {files:"leph2", start:9, ch:["Ray Optics and Optical Instruments","Wave Optics","Dual Nature of Radiation and Matter","Atoms","Nuclei","Semiconductor Electronics"]}
  ],
  Chemistry:[
   {files:"lech1", start:1, ch:["Solutions","Electrochemistry","Chemical Kinetics","The d- and f-Block Elements","Coordination Compounds"]},
   {files:"lech2", start:6, ch:["Haloalkanes and Haloarenes","Alcohols, Phenols and Ethers","Aldehydes, Ketones and Carboxylic Acids","Amines","Biomolecules"]}
  ],
  Biology:[
   {files:"lebo1", start:1, ch:["Sexual Reproduction in Flowering Plants","Human Reproduction","Reproductive Health","Principles of Inheritance and Variation","Molecular Basis of Inheritance","Evolution","Human Health and Disease","Microbes in Human Welfare","Biotechnology: Principles and Processes","Biotechnology and its Applications","Organisms and Populations","Ecosystem","Biodiversity and Conservation"],
    tags:["Botany","Zoology","Zoology","Both","Both","Both","Zoology","Both","Both","Both","Both","Both","Both"]}
  ]
 }
};
function entries(sub){
  const src = (sub==="Zoology"||sub==="Botany") ? "Biology" : sub, out = [];
  [11,12].forEach(c=>LIB[c][src].forEach(book=>book.ch.forEach((t,i)=>{
    const tag = book.tags ? book.tags[i] : "Both";
    if(sub==="Zoology" && tag==="Botany") return;
    if(sub==="Botany"  && tag==="Zoology") return;
    out.push({sub, c, no:book.start+i, t, file:book.files+pad(i+1)});
  })));
  return out;
}
const ALL = SUBJECTS.flatMap(entries);
const esc = s => s.replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const svg = (d,extra="") => `<svg viewBox="0 0 24 24" ${extra}>${d}</svg>`;
const GO = '<svg class="go" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>';
let q = "", menuOpen = false;
const route = () => decodeURIComponent(location.hash.slice(1));
const $app = document.getElementById("app");
function chRow(e, showSub, delay){
  const s = SUB[e.sub];
  return `<a class="ch${delay==null?"":" in"}" style="--rgb:${s.rgb}${delay==null?"":`;animation-delay:${delay}ms`}" href="pdfs/${e.file}.pdf"><span class="n">${e.no}</span>
    <span class="t">${esc(e.t)}${showSub?`<span class="m">${e.sub} · Class ${e.c}</span>`:""}</span>${GO}</a>`;
}
function render(keepFocus){
  const r = route();
  let h = "";
  if(SUBJECTS.includes(r)){
    const list = entries(r);
    h += `<button class="back in" id="back">${svg('<path d="M15 5l-7 7 7 7"/>')}Subjects</button>
      <h1 class="page in" style="margin-top:6px">${r}</h1><p class="sub in">${list.length} chapters · Class 11 to 12</p>`;
    let last = 0, i = 0;
    list.forEach(e=>{
      if(e.c!==last){ h += `<div class="cls">Class ${e.c}</div>`; last = e.c; }
      h += chRow(e, false, Math.min(i++,12)*30);
    });
  } else if(r==="search"){
    const term = q.trim().toLowerCase();
    h += `<h1 class="page in">Search</h1><p class="sub in">Find a chapter in any subject</p>
      <div class="field in">${svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>')}<input id="q" type="text" enterkeyhint="search" placeholder="Search chapters" value="${esc(q)}" autocomplete="off"></div>`;
    if(term){
      const hit = ALL.filter(e=>e.t.toLowerCase().includes(term));
      h += hit.length ? hit.map(e=>chRow(e,true)).join("") : `<div class="none">No chapters found</div>`;
    }
  } else {
    h += `<h1 class="brand in">NCERT Shelf</h1>
      <p class="tag in">Class 11 and 12 textbooks — every chapter, saved on your phone.</p>
      <div class="pills in"><span class="pill"><b>${ALL.length}</b>chapters</span><span class="pill">Works offline</span></div>
      <div class="grid">${SUBJECTS.map((s,i)=>{
        const n = entries(s), c = SUB[s];
        return `<a class="sc in" style="--rgb:${c.rgb};animation-delay:${i*60}ms" href="#${s}"><div class="ic">${svg(c.icon)}</div><h3>${s}</h3><p>${n.length} chapters</p></a>`;
      }).join("")}</div>`;
  }
  $app.innerHTML = h;
  const onSearch = r==="search";
  document.getElementById("nav").innerHTML =
    `<a href="#" class="${onSearch?"":"on"}">${svg('<path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M5 17a3 3 0 0 1 3-3h11"/>')}Subjects</a>
     <a href="#search" class="${onSearch?"on":""}">${svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>')}Search</a>`;
  const qi = document.getElementById("q");
  if(qi){
    if(keepFocus || !q){ qi.focus(); qi.setSelectionRange(qi.value.length, qi.value.length); }
    qi.addEventListener("input", e=>{ q = e.target.value; render(true); });
  }
  const bk = document.getElementById("back");
  if(bk) bk.onclick = ()=>{ history.length>1 ? history.back() : (location.hash=""); };
  renderMenu();
}
function renderMenu(){
  const host = document.getElementById("menuHost");
  if(!menuOpen){ host.innerHTML = ""; return; }
  const app = window.Android && Android.has;
  let have = 0;
  if(app) ALL.forEach(e=>{ if(Android.has(e.file)) have++; });
  host.innerHTML = `<div class="menu">
    <div class="info">${app ? `${have} of ${ALL.length} chapters on this phone` : "Class 11 and 12 NCERT PDFs"}</div>
    <div class="info" style="padding-top:0">Version 3 · navy design</div>
    ${app ? `<button id="imp">Import PDFs</button>` : ""}</div>`;
  const imp = document.getElementById("imp");
  if(imp) imp.onclick = ()=>{ menuOpen = false; renderMenu(); Android.importPdfs(); };
}
document.getElementById("fab").onclick = e=>{ e.stopPropagation(); menuOpen = !menuOpen; renderMenu(); };
document.addEventListener("click", e=>{ if(menuOpen && !e.target.closest(".menu")){ menuOpen = false; renderMenu(); } });
window.addEventListener("hashchange", ()=>{ q = ""; menuOpen = false; render(); window.scrollTo(0,0); });
render();
</script>
</body>
</html>
