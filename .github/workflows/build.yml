name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euxo pipefail
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify build environment
        run: |
          java -version
          gradle --version
          ls -la
          test -f settings.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug --stacktrace --warning-mode all

      - name: Confirm APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NCERTShelf-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
